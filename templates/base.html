<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Arslan Toolbox{% endblock %}</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#272b35; --text:#e8eaf0; --muted:#8b92a3; --accent:#5b8cff; --ok:#3ecf8e; --err:#ff6b6b; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f5f6f8; --panel:#fff; --line:#e1e4ea; --text:#1b1e26; --muted:#6b7385; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); display:flex; min-height:100vh; }
  nav { width:240px; background:var(--panel); border-right:1px solid var(--line); padding:18px 12px; position:sticky; top:0; height:100vh; overflow:auto; }
  nav h1 { font-size:17px; margin:0 8px 16px; }
  nav a { display:flex; gap:10px; align-items:center; padding:9px 10px; border-radius:8px; color:var(--text); text-decoration:none; font-size:14px; }
  nav a:hover, nav a.active { background:var(--bg); }
  main { flex:1; padding:28px 32px; max-width:900px; }
  h2 { margin-top:0; }
  .muted { color:var(--muted); font-size:14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; }
  input[type=text], select { width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-size:15px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; margin-top:12px; align-items:center; }
  .row > * { flex:0 0 auto; }
  button { padding:10px 18px; border-radius:8px; border:0; background:var(--accent); color:#fff; font-size:15px; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--text); }
  button:disabled { opacity:.5; cursor:default; }
  .bar { height:10px; background:var(--bg); border-radius:99px; overflow:hidden; margin-top:14px; }
  .bar > div { height:100%; width:0; background:var(--accent); transition:width .3s; }
  .ok { color:var(--ok); } .err { color:var(--err); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
  .grid a { text-decoration:none; color:inherit; }
  .grid .card { margin:0; } .grid .card:hover { border-color:var(--accent); }
</style>
</head>
<body>
<nav>
  <h1>🧰 Arslan Toolbox</h1>
  <a href="/" class="{{ 'active' if request.path == '/' }}">🏠 Home</a>
  {% for t in tools %}
  <a href="/{{ t.slug }}/" class="{{ 'active' if request.path.startswith('/' ~ t.slug) }}">{{ t.icon }} {{ t.name }}</a>
  {% endfor %}
</nav>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
